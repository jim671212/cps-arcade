<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>CPS Arcade v1.2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="version">v1.2</div>
<div id="installBanner" class="install-banner hidden"><span>安裝到桌面，玩起來更像原生遊戲</span><button id="installBtn">安裝</button><button id="installClose" class="ghost">×</button></div>
<main id="app">
  <section id="library" class="library">
    <div class="brand"><b>CPS ARCADE</b><span>手機橫向優先 · 點遊戲直接進入</span></div>
    <div class="games">
      <button class="game-card" data-game="tk2j"><span class="num">01</span><strong>三國志2</strong><small>Warriors of Fate</small></button>
      <button class="game-card" data-game="sf2j"><span class="num">02</span><strong>快打旋風</strong><small>Street Fighter II</small></button>
      <button class="game-card" data-game="knights"><span class="num">03</span><strong>圓桌武士</strong><small>Knights of the Round</small></button>
    </div>
    <div class="library-actions"><button id="multiOpen">多人連線</button><button id="fullscreenHome" class="ghost">全螢幕</button></div>
  </section>
</main>
<div id="multiModal" class="modal hidden"><div class="modal-card"><button id="multiClose" class="modal-x">×</button><h2>多人連線</h2><p>4 碼邀請功能保留，遊戲同步將在後續版本強化。</p><div class="room-code" id="roomCode">----</div><div class="multi-actions"><button id="hostRoom">建立房間</button><div class="join-row"><input id="joinCode" maxlength="4" inputmode="numeric" placeholder="4碼"><button id="joinRoom">加入</button></div></div><div id="netStatus" class="status">尚未連線</div></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="home-v12.js"></script>
</body>
</html>
