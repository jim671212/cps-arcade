rt=function(){log('[EJS] game start');l.classList.add('hidden');setTimeout(()=>d.style.display='none',2500)};setTimeout(()=>{if(!l.classList.contains('hidden')){log('[TIMEOUT 15s] onGameStart 尚未觸發；移除遮罩以顯示核心畫面');t.textContent='啟動逾時－下方顯示核心實際畫面';l.classList.add('timeout')}},15000);setTimeout(()=>{if(!l.classList.contains('hidden')){l.style.display='none';log('[TIMEOUT 18s] loading overlay removed')}},18000)})();</script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script></body></html>
