<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><title>Arcade Pocket v1.1</title><link rel="stylesheet" href="style.css"></head><body>
<div class="version">v1.1</div>
<div id="installBar" class="install hidden"><span id="installText">安裝到桌面</span><button id="installBtn">安裝</button><button id="installDismiss" class="icon">×</button></div>
<main class="home"><header><div><small>ARCADE POCKET</small><h1>街機模擬器</h1><p>手機橫向優先 · 全螢幕 · PWA · 4碼多人連線</p></div><button id="homeFull" class="round">⛶</button></header>
<section class="games" id="games"></section>
<footer><button id="multiBtn">◉ 多人連線</button><span>ROM 模組化，可持續擴充</span></footer></main>
<div id="multiModal" class="modal hidden"><div class="card"><button id="multiClose" class="close">×</button><h2>多人連線</h2><p>主機建立 4 碼，朋友輸入後即可加入。語音預設開啟。</p><div id="roomCode" class="code">----</div><button id="hostBtn" class="primary">建立房間</button><div class="join"><input id="joinInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="4 碼"><button id="joinBtn">加入</button></div><div id="netStatus" class="status">尚未連線</div></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script src="app.js"></script></body></html>
